<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0015, #1a0030);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .slot-machine {
            background: #1a0030;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }
        .reel {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 15px;
            min-width: 100px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .reel img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 10px;
        }
        .result {
            text-align: center;
            font-size: 18px;
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
        }
        .result.win {
            color: #ffd93d;
        }
        .result.lose {
            color: #ff6b6b;
        }
        .button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.4);
            margin-bottom: 12px;
        }
        .button:active {
            transform: scale(0.95);
        }
        .button:disabled {
            opacity: 0.5;
        }
        .support-btn {
            background: linear-gradient(45deg, #4a00e0, #8e2de2);
            box-shadow: 0 8px 25px rgba(74, 0, 224, 0.4);
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-group .button {
            flex: 1;
        }
        .info {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-top: 15px;
        }
        .info-item {
            text-align: center;
        }
        .info-item .label {
            font-size: 12px;
            color: #888;
        }
        .info-item .value {
            font-size: 22px;
            font-weight: bold;
            color: #ffd93d;
        }
        .tap-area {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 12px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffd93d;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 NFT CASINO</h1>
        <p class="subtitle">Выиграй цифровое искусство</p>
        <div class="slot-machine">
            <div class="reels" id="reels">
                <div class="reel" id="reel1"></div>
                <div class="reel" id="reel2"></div>
                <div class="reel" id="reel3"></div>
            </div>
            <div class="result" id="result">Нажми "Крутить!"</div>
        </div>
        <button class="button" id="spinBtn">🎰 Крутить!</button>
        <div class="info">
            <div class="info-item">
                <div class="label">🎯 Выигрыши</div>
                <div class="value" id="wins">0</div>
            </div>
            <div class="info-item">
                <div class="label">🎮 Всего игр</div>
                <div class="value" id="total">0</div>
            </div>
            <div class="info-item">
                <div class="label">🏅 Место</div>
                <div class="value" id="rank">🏆</div>
            </div>
        </div>
        <div class="tap-area">⚡ Демо-версия. Играй и получай удовольствие!</div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ===== НАСТРОЙКИ =====
        const BOT_TOKEN = '8992217710:AAHgdwlL6Fbvuc3J4RuvhHNO5j9n3Vuo9sY';
        const DEVELOPER_USERNAME = 'bpsux';
        const BOT_USERNAME = 'democasinotgBot';

        // ===== ПРИЗЫ С ЦЕНАМИ И ШАНСАМИ =====
        const prizes = [
            // Обычные подарки (высокий шанс)
            { 
                name: '🎁 Подарок (15⭐)', 
                price: 15, 
                weight: 30, 
                img: 'https://i.postimg.cc/18pgQj9x/lv-0-20260831161053.png' 
            },
            { 
                name: '🎁 Подарок (15⭐)', 
                price: 15, 
                weight: 30, 
                img: 'https://i.postimg.cc/k2xVmp7L/lv-0-20260831161146.png' 
            },
            { 
                name: '🎁 Подарок (25⭐)', 
                price: 25, 
                weight: 25, 
                img: 'https://i.postimg.cc/xXKk240n/lv-0-20260831161010.png' 
            },
            { 
                name: '🎁 Подарок (25⭐)', 
                price: 25, 
                weight: 25, 
                img: 'https://i.postimg.cc/SjyjVtrM/lv-0-20260901085459.png' 
            },
            { 
                name: '🎁 Подарок (50⭐)', 
                price: 50, 
                weight: 20, 
                img: 'https://i.postimg.cc/grYr4BDh/lv-0-20260901085803.png' 
            },
            { 
                name: '🎁 Подарок (50⭐)', 
                price: 50, 
                weight: 20, 
                img: 'https://i.postimg.cc/G9c9zSQs/lv-0-20260901085608.png' 
            },
            { 
                name: '💎 Средний подарок (100⭐)', 
                price: 100, 
                weight: 15, 
                img: 'https://i.postimg.cc/87hFS0Tq/lv-0-20260831160855.png' 
            },
            
            // Дорогие NFT (низкий шанс)
            { 
                name: '🖼️ NFT #1', 
                price: 400, 
                weight: 5, 
                img: 'https://i.postimg.cc/jDzWbFRP/lv-0-20260831161855.png' 
            },
            { 
                name: '🖼️ NFT #2', 
                price: 500, 
                weight: 4, 
                img: 'https://i.postimg.cc/214qDKCK/lv-0-20260831161303.png' 
            },
            { 
                name: '👑 Легендарный NFT', 
                price: 1000, 
                weight: 2, 
                img: 'https://i.postimg.cc/21pqgDNF/lv-0-20260831161958.png' 
            },
        ];

        // ===== ФУНКЦИЯ ВЫБОРА ПРИЗА С УЧЁТОМ ВЕСОВ =====
        function getRandomPrize() {
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (const prize of prizes) {
                random -= prize.weight;
                if (random <= 0) {
                    return prize;
                }
            }
            return prizes[0];
        }

        // ===== ИГРА =====
        let wins = 0,
            total = 0,
            isSpinning = false;
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const resultDiv = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        const winsSpan = document.getElementById('wins');
        const totalSpan = document.getElementById('total');
        const rankSpan = document.getElementById('rank');
        const toast = document.getElementById('toast');
        const tg = window.Telegram.WebApp;
        tg.expand();

        function renderReel(element, prize) {
            element.innerHTML = `<img src="${prize.img}" alt="${prize.name}">`;
            element.dataset.price = prize.price;
            element.dataset.name = prize.name;
        }

        function showToast(message, duration = 3000) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        function spin() {
            if (isSpinning) return;

            isSpinning = true;
            spinBtn.disabled = true;

            let count = 0;
            const interval = setInterval(() => {
                renderReel(reel1, getRandomPrize());
                renderReel(reel2, getRandomPrize());
                renderReel(reel3, getRandomPrize());
                count++;
                if (count > 20) {
                    clearInterval(interval);
                    const r1 = getRandomPrize();
                    const r2 = getRandomPrize();
                    const r3 = getRandomPrize();
                    renderReel(reel1, r1);
                    renderReel(reel2, r2);
                    renderReel(reel3, r3);
                    total++;
                    totalSpan.textContent = total;

                    // Проверка выигрыша (по цене призов)
                    if (r1.price === r2.price && r2.price === r3.price) {
                        wins++;
                        winsSpan.textContent = wins;
                        resultDiv.textContent = `🎉 ДЖЕКПОТ! Три ${r1.name}!`;
                        resultDiv.className = 'result win';
                        showToast(`🎉 Выиграл ${r1.name} (${r1.price}⭐)!`, 3000);
                    } else if (r1.price === r2.price || r2.price === r3.price || r1.price === r3.price) {
                        wins++;
                        winsSpan.textContent = wins;
                        resultDiv.textContent = `🔔 Два ${r1.name} совпали! Почти выиграл!`;
                        resultDiv.className = 'result win';
                        showToast(`🔔 Два ${r1.name} (${r1.price}⭐)!`, 2000);
                    } else {
                        resultDiv.textContent = `😔 Ничего не совпало. Попробуй ещё!`;
                        resultDiv.className = 'result lose';
                    }

                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }, 80);
        }

        spinBtn.addEventListener('click', spin);

        // ===== ПРИ ЗАГРУЗКЕ =====
        renderReel(reel1, getRandomPrize());
        renderReel(reel2, getRandomPrize());
        renderReel(reel3, getRandomPrize());

        const savedWins = localStorage.getItem('localWins');
        const savedTotal = localStorage.getItem('localTotal');
        if (savedWins) wins = parseInt(savedWins);
        if (savedTotal) total = parseInt(savedTotal);
        winsSpan.textContent = wins;
        totalSpan.textContent = total;

        setInterval(() => {
            localStorage.setItem('localWins', wins);
            localStorage.setItem('localTotal', total);
        }, 5000);

        rankSpan.textContent = '🏆';

        console.log('🎰 Игра загружена!');
        console.log('👤 Пользователь:', tg.initDataUnsafe?.user);
    </script>
</body>
</html>
