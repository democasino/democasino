<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0015, #1a0030);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: transparent;
            color: #888;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd93d;
            color: #ffd93d;
        }
        .tab-btn:active {
            transform: scale(0.95);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ===== РУЛЕТКА ===== */
        .slot-machine {
            background: #1a0030;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }
        .reel {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 15px;
            min-width: 100px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .reel img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 10px;
        }
        .result {
            text-align: center;
            font-size: 18px;
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
        }
        .result.win {
            color: #ffd93d;
        }
        .result.lose {
            color: #ff6b6b;
        }
        .button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.4);
            margin-bottom: 12px;
        }
        .button:active {
            transform: scale(0.95);
        }
        .button:disabled {
            opacity: 0.5;
        }
        .info {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-top: 15px;
        }
        .info-item {
            text-align: center;
        }
        .info-item .label {
            font-size: 12px;
            color: #888;
        }
        .info-item .value {
            font-size: 22px;
            font-weight: bold;
            color: #ffd93d;
        }

        /* ===== РЕЙТИНГ ===== */
        .rating-list {
            padding: 10px 0;
        }
        .rating-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        .rating-item.top1 {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
        .rating-item.top2 {
            border-color: #c0c0c0;
            background: rgba(192, 192, 192, 0.1);
        }
        .rating-item.top3 {
            border-color: #cd7f32;
            background: rgba(205, 127, 50, 0.1);
        }
        .rating-item .medal {
            font-size: 24px;
            margin-right: 12px;
        }
        .rating-item .name {
            flex: 1;
            font-weight: bold;
        }
        .rating-item .score {
            color: #ffd93d;
            font-weight: bold;
        }
        .rating-loading {
            text-align: center;
            color: #888;
            padding: 30px;
        }
        .rating-empty {
            text-align: center;
            color: #888;
            padding: 30px;
        }
        .refresh-btn {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: transparent;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .refresh-btn:active {
            transform: scale(0.95);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffd93d;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 NFT CASINO</h1>
        <p class="subtitle">Выиграй цифровое искусство</p>

        <!-- ===== ВКЛАДКИ ===== -->
        <div class="tabs">
            <button class="tab-btn active" id="tabCasino" onclick="switchTab('casino')">🎰 Рулетка</button>
            <button class="tab-btn" id="tabRating" onclick="switchTab('rating')">🏆 Рейтинг</button>
        </div>

        <!-- ===== ВКЛАДКА "РУЛЕТКА" ===== -->
        <div class="tab-content active" id="tabCasinoContent">
            <div class="slot-machine">
                <div class="reels" id="reels">
                    <div class="reel" id="reel1"></div>
                    <div class="reel" id="reel2"></div>
                    <div class="reel" id="reel3"></div>
                </div>
                <div class="result" id="result">Нажми "Крутить!"</div>
            </div>
            <button class="button" id="spinBtn">🎰 Крутить!</button>
            <div class="info">
                <div class="info-item">
                    <div class="label">🎯 Выигрыши</div>
                    <div class="value" id="wins">0</div>
                </div>
                <div class="info-item">
                    <div class="label">🎮 Всего игр</div>
                    <div class="value" id="total">0</div>
                </div>
                <div class="info-item">
                    <div class="label">🏅 Место</div>
                    <div class="value" id="rank">-</div>
                </div>
            </div>
        </div>

        <!-- ===== ВКЛАДКА "РЕЙТИНГ" ===== -->
        <div class="tab-content" id="tabRatingContent">
            <div class="rating-list" id="ratingList">
                <div class="rating-loading">⏳ Загрузка рейтинга...</div>
            </div>
            <button class="refresh-btn" onclick="loadRating()">🔄 Обновить рейтинг</button>
        </div>

        <div class="tap-area" style="margin-top:15px;text-align:center;color:#555;font-size:12px;">
            ⚡ Демо-версия. Играй и попади в ТОП-10!
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ===== ТВОИ NFT КАРТИНКИ =====
        const nftImages = [
            'https://i.postimg.cc/K1gPgfxn/lv-0-20260831162300.png',
            'https://i.postimg.cc/87hFS0Tq/lv-0-20260831160855.png',
            'https://i.postimg.cc/xXKk240n/lv-0-20260831161010.png',
            'https://i.postimg.cc/18pgQj9x/lv-0-20260831161053.png',
            'https://i.postimg.cc/k2xVmp7L/lv-0-20260831161146.png',
            'https://i.postimg.cc/XrMZtb6K/lv-0-20260831162107.png',
            'https://i.postimg.cc/21pqgDNF/lv-0-20260831161958.png',
            'https://i.postimg.cc/jDzWbFRP/lv-0-20260831161855.png',
            'https://i.postimg.cc/214qDKCK/lv-0-20260831161303.png',
        ];

        // ===== НАСТРОЙКИ =====
        const BOT_TOKEN = '8992217710:AAHgdwlL6Fbvuc3J4RuvhHNO5j9n3Vuo9sY';
        const BOT_USERNAME = 'democasinotgBot';

        // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
        function switchTab(tab) {
            // Скрываем все вкладки
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            // Показываем выбранную
            if (tab === 'casino') {
                document.getElementById('tabCasinoContent').classList.add('active');
                document.getElementById('tabCasino').classList.add('active');
            } else if (tab === 'rating') {
                document.getElementById('tabRatingContent').classList.add('active');
                document.getElementById('tabRating').classList.add('active');
                loadRating(); // Загружаем рейтинг при переключении
            }
        }

        // ===== ЗАГРУЗКА РЕЙТИНГА =====
        function loadRating() {
            const ratingList = document.getElementById('ratingList');
            ratingList.innerHTML = '<div class="rating-loading">⏳ Загрузка рейтинга...</div>';

            const userId = tg.initDataUnsafe?.user?.id;
            if (!userId) {
                ratingList.innerHTML = '<div class="rating-empty">❌ Не удалось определить пользователя</div>';
                return;
            }

            // Получаем топ-10 через бота
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-1`)
                .then(() => {
                    // Отправляем запрос боту на получение топа
                    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            chat_id: userId,
                            text: '/top',
                            parse_mode: 'Markdown'
                        })
                    });
                })
                .then(response => {
                    if (response.ok) {
                        // Так как мы не можем получить ответ напрямую из Web App,
                        // показываем сообщение, что топ отправлен в чат
                        ratingList.innerHTML = `
                            <div class="rating-empty">
                                🏆 Топ-10 отправлен в чат с ботом!<br>
                                <small style="color:#555;">Напиши /top вручную, если не пришло</small>
                            </div>
                        `;
                        showToast('📨 Топ отправлен в чат!', 2000);
                    } else {
                        ratingList.innerHTML = `
                            <div class="rating-empty">
                                ❌ Не удалось загрузить рейтинг<br>
                                <small style="color:#555;">Попробуй написать /top в чате с ботом</small>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.log('Ошибка:', error);
                    ratingList.innerHTML = `
                        <div class="rating-empty">
                            ❌ Ошибка сети<br>
                            <small style="color:#555;">Попробуй написать /top в чате с ботом</small>
                        </div>
                    `;
                });
        }

        // ===== КОД РУЛЕТКИ =====
        let wins = 0,
            total = 0,
            isSpinning = false;
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const resultDiv = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        const winsSpan = document.getElementById('wins');
        const totalSpan = document.getElementById('total');
        const rankSpan = document.getElementById('rank');
        const toast = document.getElementById('toast');
        const tg = window.Telegram.WebApp;
        tg.expand();

        function getRandomNFT() {
            return nftImages[Math.floor(Math.random() * nftImages.length)];
        }

        function renderReel(element, imageUrl) {
            element.innerHTML = `<img src="${imageUrl}" alt="NFT">`;
        }

        function showToast(message, duration = 3000) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        function sendWinToBot() {
            const userId = tg.initDataUnsafe?.user?.id;
            if (!userId) {
                console.log('Не удалось определить пользователя');
                return;
            }

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: userId,
                    text: '/win',
                    parse_mode: 'Markdown'
                })
            }).then(response => {
                if (response.ok) {
                    console.log('✅ Победа отправлена боту!');
                } else {
                    console.log('⚠️ Ошибка при отправке победы');
                }
            }).catch(error => {
                console.log('❌ Ошибка сети:', error);
            });
        }

        function spin() {
            if (isSpinning) return;

            isSpinning = true;
            spinBtn.disabled = true;

            let count = 0;
            const interval = setInterval(() => {
                renderReel(reel1, getRandomNFT());
                renderReel(reel2, getRandomNFT());
                renderReel(reel3, getRandomNFT());
                count++;
                if (count > 20) {
                    clearInterval(interval);
                    const r1 = getRandomNFT();
                    const r2 = getRandomNFT();
                    const r3 = getRandomNFT();
                    renderReel(reel1, r1);
                    renderReel(reel2, r2);
                    renderReel(reel3, r3);
                    total++;
                    totalSpan.textContent = total;

                    if (r1 === r2 && r2 === r3) {
                        wins++;
                        winsSpan.textContent = wins;
                        resultDiv.textContent = '🎉 ДЖЕКПОТ! Три одинаковых NFT!';
                        resultDiv.className = 'result win';
                        sendWinToBot();
                        showToast('🏆 Победа отправлена в рейтинг!', 2000);
                    } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                        wins++;
                        winsSpan.textContent = wins;
                        resultDiv.textContent = '🔔 Два NFT совпали! Почти выиграл!';
                        resultDiv.className = 'result win';
                        sendWinToBot();
                        showToast('🏆 Победа отправлена в рейтинг!', 2000);
                    } else {
                        resultDiv.textContent = '😔 Ничего не совпало. Попробуй ещё!';
                        resultDiv.className = 'result lose';
                    }

                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }, 80);
        }

        spinBtn.addEventListener('click', spin);

        // ===== ПРИ ЗАГРУЗКЕ =====
        renderReel(reel1, getRandomNFT());
        renderReel(reel2, getRandomNFT());
        renderReel(reel3, getRandomNFT());

        const savedWins = localStorage.getItem('localWins');
        const savedTotal = localStorage.getItem('localTotal');
        if (savedWins) wins = parseInt(savedWins);
        if (savedTotal) total = parseInt(savedTotal);
        winsSpan.textContent = wins;
        totalSpan.textContent = total;

        setInterval(() => {
            localStorage.setItem('localWins', wins);
            localStorage.setItem('localTotal', total);
        }, 5000);

        rankSpan.textContent = '🏆';

        console.log('🎰 Игра загружена!');
        console.log('👤 Пользователь:', tg.initDataUnsafe?.user);
    </script>
</body>
</html>
