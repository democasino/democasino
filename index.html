<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Casino - Кейсы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0015, #1a0030);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .balance {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffd93d;
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .case-btn {
            padding: 16px 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.03);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .case-btn:active {
            transform: scale(0.95);
        }
        .case-btn .price {
            display: block;
            font-size: 12px;
            color: #ffd93d;
            margin-top: 4px;
        }
        .case-btn.free {
            border-color: rgba(0, 255, 200, 0.3);
        }
        .case-btn.common {
            border-color: rgba(100, 200, 255, 0.3);
        }
        .case-btn.medium {
            border-color: rgba(200, 100, 255, 0.3);
        }
        .case-btn.lux {
            border-color: rgba(255, 215, 0, 0.4);
        }
        .case-btn.legendary {
            border-color: rgba(255, 50, 50, 0.5);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: linear-gradient(145deg, #1a0a2e, #2d1b4e);
            border-radius: 30px;
            padding: 35px 25px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ffd93d;
            margin-bottom: 15px;
        }
        .modal-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .modal-item {
            text-align: center;
            padding: 10px 5px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: #ccc;
        }
        .modal-item .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }
        .modal-item .nft-tag {
            font-size: 10px;
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.15);
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }
        .modal-result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 60px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .modal-result.win {
            color: #ffd93d;
            border-color: rgba(255, 215, 0, 0.3);
        }
        .modal-result.lose {
            color: #ff6b6b;
            border-color: rgba(255, 0, 0, 0.2);
        }
        .modal-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #ffd93d, #f7971e);
            color: #1a0030;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
            transition: all 0.2s;
        }
        .modal-btn:active {
            transform: scale(0.95);
        }
        .modal-close-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: transparent;
            color: #888;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffd93d;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 NFT CASINO</h1>
        <p class="subtitle">Открывай кейсы и выигрывай NFT</p>
        <div class="balance" id="balanceDisplay">⭐ 9999</div>

        <div class="cases-grid" id="casesGrid">
            <button class="case-btn free" data-case="free">🎁 Бесплатный<span class="price">0 ⭐</span></button>
            <button class="case-btn common" data-case="common">🔵 Обычный<span class="price">50 ⭐</span></button>
            <button class="case-btn medium" data-case="medium">🟣 Средний<span class="price">100 ⭐</span></button>
            <button class="case-btn lux" data-case="lux">🟡 Люкс<span class="price">250 ⭐</span></button>
            <button class="case-btn legendary" data-case="legendary">🔥 Легендарный<span class="price">500 ⭐</span></button>
        </div>

        <div style="text-align:center;color:#555;font-size:12px;margin-top:10px;">
            ⚡ Демо-версия. Все звёзды бесконечны.
        </div>
    </div>

    <div class="modal-overlay" id="caseModal">
        <div class="modal">
            <div class="modal-title" id="modalTitle">📦 Открытие кейса</div>
            <div class="modal-items" id="modalItems"></div>
            <div class="modal-result" id="modalResult">🎰 Нажми "Открыть"</div>
            <button class="modal-btn" id="openCaseBtn">🔑 Открыть</button>
            <button class="modal-close-btn" id="closeModalBtn">Закрыть</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ===== НАСТРОЙКИ =====
        let balance = 9999;
        let currentCase = null;

        // ===== КЕЙСЫ =====
        const CASES = {
            free: {
                name: '🎁 Бесплатный',
                price: 0,
                items: [
                    // Визуальные NFT (только для красоты)
                    { name: '🖼️ NFT Mirage #1', type: 'display' },
                    { name: '🖼️ NFT Mirage #2', type: 'display' },
                    { name: '🖼️ NFT Mirage #3', type: 'display' },
                    // Реальные призы
                    { name: '🍀 Попробуй снова', type: 'real', weight: 60 },
                    { name: '⭐ 1 звезда', type: 'real', weight: 25 },
                    { name: '🎁 Подарок', type: 'real', weight: 15 },
                ],
                realItems: [
                    { name: '🍀 Попробуй снова', weight: 60 },
                    { name: '⭐ 1 звезда', weight: 25 },
                    { name: '🎁 Подарок', weight: 15 },
                ]
            },
            common: {
                name: '🔵 Обычный',
                price: 50,
                items: [
                    { name: '🖼️ NFT Mirage #1', type: 'display' },
                    { name: '🖼️ NFT Mirage #2', type: 'display' },
                    { name: '🖼️ NFT Mirage #3', type: 'display' },
                    { name: '🖼️ NFT Real #1', type: 'real', weight: 2 },
                    { name: '🖼️ NFT Real #2', type: 'real', weight: 2 },
                    { name: '🎁 Подарок', type: 'real', weight: 40 },
                    { name: '⭐ 5 звёзд', type: 'real', weight: 30 },
                    { name: '🍀 Попробуй снова', type: 'real', weight: 26 },
                ],
                realItems: [
                    { name: '🖼️ NFT Real #1', weight: 2 },
                    { name: '🖼️ NFT Real #2', weight: 2 },
                    { name: '🎁 Подарок', weight: 40 },
                    { name: '⭐ 5 звёзд', weight: 30 },
                    { name: '🍀 Попробуй снова', weight: 26 },
                ]
            },
            medium: {
                name: '🟣 Средний',
                price: 100,
                items: [
                    { name: '🖼️ NFT Mirage #1', type: 'display' },
                    { name: '🖼️ NFT Mirage #2', type: 'display' },
                    { name: '🖼️ NFT Mirage #3', type: 'display' },
                    { name: '🖼️ NFT Mirage #4', type: 'display' },
                    { name: '🖼️ NFT Real #1', type: 'real', weight: 2 },
                    { name: '🖼️ NFT Real #2', type: 'real', weight: 2 },
                    { name: '🖼️ NFT Real #3', type: 'real', weight: 2 },
                    { name: '🎁 Подарок', type: 'real', weight: 35 },
                    { name: '⭐ 10 звёзд', type: 'real', weight: 25 },
                    { name: '🍀 Попробуй снова', type: 'real', weight: 34 },
                ],
                realItems: [
                    { name: '🖼️ NFT Real #1', weight: 2 },
                    { name: '🖼️ NFT Real #2', weight: 2 },
                    { name: '🖼️ NFT Real #3', weight: 2 },
                    { name: '🎁 Подарок', weight: 35 },
                    { name: '⭐ 10 звёзд', weight: 25 },
                    { name: '🍀 Попробуй снова', weight: 34 },
                ]
            },
            lux: {
                name: '🟡 Люкс',
                price: 250,
                items: [
                    { name: '🖼️ NFT Mirage #1', type: 'display' },
                    { name: '🖼️ NFT Mirage #2', type: 'display' },
                    { name: '🖼️ NFT Mirage #3', type: 'display' },
                    { name: '🖼️ NFT Mirage #4', type: 'display' },
                    { name: '🖼️ NFT Real #1', type: 'real', weight: 3 },
                    { name: '🖼️ NFT Real #2', type: 'real', weight: 3 },
                    { name: '🖼️ NFT Real #3', type: 'real', weight: 3 },
                    { name: '🖼️ NFT Real #4', type: 'real', weight: 3 },
                    { name: '🎁 Подарок', type: 'real', weight: 30 },
                    { name: '⭐ 25 звёзд', type: 'real', weight: 20 },
                    { name: '🍀 Попробуй снова', type: 'real', weight: 38 },
                ],
                realItems: [
                    { name: '🖼️ NFT Real #1', weight: 3 },
                    { name: '🖼️ NFT Real #2', weight: 3 },
                    { name: '🖼️ NFT Real #3', weight: 3 },
                    { name: '🖼️ NFT Real #4', weight: 3 },
                    { name: '🎁 Подарок', weight: 30 },
                    { name: '⭐ 25 звёзд', weight: 20 },
                    { name: '🍀 Попробуй снова', weight: 38 },
                ]
            },
            legendary: {
                name: '🔥 Легендарный',
                price: 500,
                items: [
                    { name: '🖼️ NFT Mirage #1', type: 'display' },
                    { name: '🖼️ NFT Mirage #2', type: 'display' },
                    { name: '🖼️ NFT Mirage #3', type: 'display' },
                    { name: '🖼️ NFT Mirage #4', type: 'display' },
                    { name: '🖼️ NFT Real #1', type: 'real', weight: 5 },
                    { name: '🖼️ NFT Real #2', type: 'real', weight: 5 },
                    { name: '🖼️ NFT Real #3', type: 'real', weight: 5 },
                    { name: '🖼️ NFT Real #4', type: 'real', weight: 5 },
                    { name: '🖼️ NFT Real #5', type: 'real', weight: 5 },
                    { name: '🎁 Подарок', type: 'real', weight: 25 },
                    { name: '⭐ 50 звёзд', type: 'real', weight: 20 },
                    { name: '🍀 Попробуй снова', type: 'real', weight: 30 },
                ],
                realItems: [
                    { name: '🖼️ NFT Real #1', weight: 5 },
                    { name: '🖼️ NFT Real #2', weight: 5 },
                    { name: '🖼️ NFT Real #3', weight: 5 },
                    { name: '🖼️ NFT Real #4', weight: 5 },
                    { name: '🖼️ NFT Real #5', weight: 5 },
                    { name: '🎁 Подарок', weight: 25 },
                    { name: '⭐ 50 звёзд', weight: 20 },
                    { name: '🍀 Попробуй снова', weight: 30 },
                ]
            }
        };

        // ===== ФУНКЦИИ =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').textContent = `⭐ ${balance}`;
        }

        function getRandomRealItem(caseKey) {
            const caseData = CASES[caseKey];
            const items = caseData.realItems;
            const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            for (const item of items) {
                random -= item.weight;
                if (random <= 0) {
                    return item;
                }
            }
            return items[0];
        }

        function openCase(caseKey) {
            const caseData = CASES[caseKey];
            const modal = document.getElementById('caseModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalItems = document.getElementById('modalItems');
            const modalResult = document.getElementById('modalResult');
            const openBtn = document.getElementById('openCaseBtn');

            // Показываем визуал кейса
            currentCase = caseKey;
            modalTitle.textContent = `📦 ${caseData.name}`;
            
            // Отображаем все предметы в кейсе (визуал)
            modalItems.innerHTML = caseData.items.map(item => {
                const isDisplay = item.type === 'display';
                return `
                    <div class="modal-item">
                        <span class="icon">${item.name.split(' ')[0]}</span>
                        ${item.name}
                        ${isDisplay ? '<span class="nft-tag">❓</span>' : ''}
                    </div>
                `;
            }).join('');

            modalResult.textContent = '🎰 Нажми "Открыть"';
            modalResult.className = 'modal-result';
            
            // Показываем модалку
            modal.classList.add('active');

            // Обработчик открытия
            openBtn.onclick = function() {
                // Проверяем баланс
                if (caseData.price > balance && caseKey !== 'free') {
                    showToast('❌ Недостаточно звёзд!');
                    return;
                }

                // Списываем звёзды (кроме бесплатного)
                if (caseKey !== 'free') {
                    balance -= caseData.price;
                    updateBalance();
                }

                // Выбираем реальный приз
                const prize = getRandomRealItem(caseKey);
                
                // Показываем результат
                modalResult.textContent = `🎉 Выпало: ${prize.name}`;
                modalResult.className = 'modal-result win';

                // Если выпал NFT — показываем особое сообщение
                if (prize.name.includes('NFT Real')) {
                    showToast(`🖼️ Ты выиграл ${prize.name}!`);
                } else if (prize.name === '🍀 Попробуй снова') {
                    modalResult.textContent = `😔 ${prize.name}`;
                    modalResult.className = 'modal-result lose';
                } else if (prize.name.includes('⭐')) {
                    // Добавляем звёзды, если выпали
                    const stars = parseInt(prize.name.split(' ')[1]) || 0;
                    if (stars > 0) {
                        balance += stars;
                        updateBalance();
                        showToast(`⭐ +${stars} звёзд!`);
                    }
                }

                // Отключаем кнопку на время
                openBtn.disabled = true;
                openBtn.textContent = '⏳ Открыто!';
                setTimeout(() => {
                    openBtn.disabled = false;
                    openBtn.textContent = '🔑 Открыть ещё';
                }, 1500);
            };
        }

        // ===== СОБЫТИЯ КНОПОК =====
        document.querySelectorAll('.case-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const caseKey = this.dataset.case;
                openCase(caseKey);
            });
        });

        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('caseModal').classList.remove('active');
        });

        // Закрытие по клику на фон
        document.getElementById('caseModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });

        // ===== ПРИ ЗАГРУЗКЕ =====
        updateBalance();
        console.log('🎰 Кейсы загружены! Демо-режим.');
    </script>
</body>
</html>
