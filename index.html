<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0015, #1a0030);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: transparent;
            color: #888;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd93d;
            color: #ffd93d;
        }
        .tab-btn:active {
            transform: scale(0.95);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ===== ИГРА ===== */
        .slot-machine {
            background: #1a0030;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }
        .reel {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 15px;
            min-width: 100px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .reel img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 10px;
        }
        .result {
            text-align: center;
            font-size: 18px;
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
        }
        .result.win {
            color: #ffd93d;
        }
        .result.lose {
            color: #ff6b6b;
        }
        .button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.4);
            margin-bottom: 12px;
        }
        .button:active {
            transform: scale(0.95);
        }
        .button:disabled {
            opacity: 0.5;
        }
        .support-btn {
            background: linear-gradient(45deg, #4a00e0, #8e2de2);
            box-shadow: 0 8px 25px rgba(74, 0, 224, 0.4);
        }

        /* ===== ПРОФИЛЬ ===== */
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .profile-avatar {
            text-align: center;
            font-size: 64px;
            margin-bottom: 10px;
        }
        .profile-name {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffd93d;
            margin-bottom: 5px;
        }
        .profile-id {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-item .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd93d;
        }
        .stat-item .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .profile-support {
            margin-top: 20px;
            padding: 15px;
            background: rgba(74, 0, 224, 0.15);
            border-radius: 12px;
            border: 1px solid rgba(74, 0, 224, 0.3);
            text-align: center;
        }
        .profile-support .support-text {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .profile-support .support-link {
            color: #ffd93d;
            font-weight: bold;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffd93d;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 NFT CASINO</h1>
        <p class="subtitle">Выиграй цифровое искусство</p>

        <!-- ===== ВКЛАДКИ ===== -->
        <div class="tabs">
            <button class="tab-btn active" id="tabGame" onclick="switchTab('game')">🎰 Игра</button>
            <button class="tab-btn" id="tabProfile" onclick="switchTab('profile')">👤 Профиль</button>
        </div>

        <!-- ===== ВКЛАДКА "ИГРА" ===== -->
        <div class="tab-content active" id="tabGameContent">
            <div class="slot-machine">
                <div class="reels" id="reels">
                    <div class="reel" id="reel1"></div>
                    <div class="reel" id="reel2"></div>
                    <div class="reel" id="reel3"></div>
                </div>
                <div class="result" id="result">Нажми "Крутить!"</div>
            </div>
            <button class="button" id="spinBtn">🎰 Крутить!</button>
            <button class="button support-btn" id="supportBtn">❤️ Поддержать автора</button>
            <div style="text-align:center;color:#555;font-size:12px;margin-top:10px;">
                ⚡ Демо-версия. Играй и получай удовольствие!
            </div>
        </div>

        <!-- ===== ВКЛАДКА "ПРОФИЛЬ" ===== -->
        <div class="tab-content" id="tabProfileContent">
            <div class="profile-card">
                <div class="profile-avatar">🎰</div>
                <div class="profile-name" id="profileName">Игрок</div>
                <div class="profile-id" id="profileId">ID: ---</div>
                
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="profileWins">0</div>
                        <div class="stat-label">🏆 Победы</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="profileGames">0</div>
                        <div class="stat-label">🎮 Всего игр</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="profileWinRate">0%</div>
                        <div class="stat-label">📈 Процент побед</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="profileBestPrize">-</div>
                        <div class="stat-label">👑 Лучший приз</div>
                    </div>
                </div>

                <div class="profile-support">
                    <div class="support-text">
                        ❤️ Если тебе нравится игра — поддержи автора!
                    </div>
                    <a href="#" onclick="openSupport(); return false;" class="support-link">
                        @bpsux
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ===== НАСТРОЙКИ =====
        const DEVELOPER_USERNAME = 'bpsux';

        // ===== ПРИЗЫ =====
        const prizes = [
            { name: '🎁 Подарок (15⭐)', price: 15, weight: 30, img: 'https://i.postimg.cc/18pgQj9x/lv-0-20260831161053.png' },
            { name: '🎁 Подарок (15⭐)', price: 15, weight: 30, img: 'https://i.postimg.cc/k2xVmp7L/lv-0-20260831161146.png' },
            { name: '🎁 Подарок (25⭐)', price: 25, weight: 25, img: 'https://i.postimg.cc/xXKk240n/lv-0-20260831161010.png' },
            { name: '🎁 Подарок (25⭐)', price: 25, weight: 25, img: 'https://i.postimg.cc/SjyjVtrM/lv-0-20260901085459.png' },
            { name: '🎁 Подарок (50⭐)', price: 50, weight: 20, img: 'https://i.postimg.cc/grYr4BDh/lv-0-20260901085803.png' },
            { name: '🎁 Подарок (50⭐)', price: 50, weight: 20, img: 'https://i.postimg.cc/G9c9zSQs/lv-0-20260901085608.png' },
            { name: '💎 Средний (100⭐)', price: 100, weight: 15, img: 'https://i.postimg.cc/87hFS0Tq/lv-0-20260831160855.png' },
            { name: '🖼️ NFT #1', price: 400, weight: 5, img: 'https://i.postimg.cc/jDzWbFRP/lv-0-20260831161855.png' },
            { name: '🖼️ NFT #2', price: 500, weight: 4, img: 'https://i.postimg.cc/214qDKCK/lv-0-20260831161303.png' },
            { name: '👑 Легендарный NFT', price: 1000, weight: 2, img: 'https://i.postimg.cc/21pqgDNF/lv-0-20260831161958.png' }
        ];

        // ===== ФУНКЦИЯ ВЫБОРА ПРИЗА =====
        function getRandomPrize() {
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.random() * totalWeight;
            for (const prize of prizes) {
                random -= prize.weight;
                if (random <= 0) return prize;
            }
            return prizes[0];
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tab === 'game') {
                document.getElementById('tabGameContent').classList.add('active');
                document.getElementById('tabGame').classList.add('active');
            } else if (tab === 'profile') {
                document.getElementById('tabProfileContent').classList.add('active');
                document.getElementById('tabProfile').classList.add('active');
                updateProfile();
            }
        }

        // ===== ОБНОВЛЕНИЕ ПРОФИЛЯ =====
        function updateProfile() {
            const wins = parseInt(localStorage.getItem('localWins') || 0);
            const total = parseInt(localStorage.getItem('localTotal') || 0);
            const bestName = localStorage.getItem('bestPrizeName') || '-';
            
            document.getElementById('profileWins').textContent = wins;
            document.getElementById('profileGames').textContent = total;
            document.getElementById('profileWinRate').textContent = 
                total > 0 ? Math.round((wins / total) * 100) + '%' : '0%';
            document.getElementById('profileBestPrize').textContent = bestName;

            // Данные пользователя из Telegram
            const tg = window.Telegram.WebApp;
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('profileName').textContent = user.first_name || 'Игрок';
                document.getElementById('profileId').textContent = `ID: ${user.id}`;
            }
        }

        // ===== КНОПКА "ПОДДЕРЖАТЬ АВТОРА" =====
        function openSupport() {
            const tg = window.Telegram.WebApp;
            tg.openTelegramLink(`https://t.me/${DEVELOPER_USERNAME}`);
            showToast('📱 Открываем чат с автором...', 2000);
        }

        // ===== ИГРА =====
        let wins = 0, total = 0, bestPrizePrice = 0, bestPrizeName = '-', isSpinning = false;
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const resultDiv = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        const supportBtn = document.getElementById('supportBtn');
        const toast = document.getElementById('toast');
        const tg = window.Telegram.WebApp;
        tg.expand();

        function renderReel(element, prize) {
            element.innerHTML = `<img src="${prize.img}" alt="${prize.name}">`;
            element.dataset.price = prize.price;
            element.dataset.name = prize.name;
        }

        function showToast(message, duration = 3000) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            let count = 0;
            const interval = setInterval(() => {
                renderReel(reel1, getRandomPrize());
                renderReel(reel2, getRandomPrize());
                renderReel(reel3, getRandomPrize());
                count++;
                if (count > 20) {
                    clearInterval(interval);
                    const r1 = getRandomPrize();
                    const r2 = getRandomPrize();
                    const r3 = getRandomPrize();
                    renderReel(reel1, r1);
                    renderReel(reel2, r2);
                    renderReel(reel3, r3);
                    total++;
                    
                    // Сохраняем лучший приз (даже при проигрыше)
                    if (r1.price > bestPrizePrice) {
                        bestPrizePrice = r1.price;
                        bestPrizeName = r1.name;
                        localStorage.setItem('bestPrizeName', bestPrizeName);
                        localStorage.setItem('bestPrizePrice', bestPrizePrice);
                    }

                    // ===== ПРОВЕРКА ПОБЕДЫ (ТОЛЬКО 3 СОВПАДЕНИЯ) =====
                    if (r1.price === r2.price && r2.price === r3.price) {
                        wins++;
                        resultDiv.textContent = `🎉 ДЖЕКПОТ! Три ${r1.name}!`;
                        resultDiv.className = 'result win';
                        showToast(`🎉 Выиграл ${r1.name} (${r1.price}⭐)!`, 3000);
                    } else {
                        resultDiv.textContent = `😔 Ничего не совпало. Попробуй ещё!`;
                        resultDiv.className = 'result lose';
                    }

                    // Сохраняем статистику
                    localStorage.setItem('localWins', wins);
                    localStorage.setItem('localTotal', total);

                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }, 80);
        }

        // ===== СОБЫТИЯ =====
        spinBtn.addEventListener('click', spin);
        supportBtn.addEventListener('click', openSupport);

        // ===== ПРИ ЗАГРУЗКЕ =====
        renderReel(reel1, getRandomPrize());
        renderReel(reel2, getRandomPrize());
        renderReel(reel3, getRandomPrize());

        wins = parseInt(localStorage.getItem('localWins') || 0);
        total = parseInt(localStorage.getItem('localTotal') || 0);
        bestPrizeName = localStorage.getItem('bestPrizeName') || '-';
        bestPrizePrice = parseInt(localStorage.getItem('bestPrizePrice') || 0);

        console.log('🎰 Игра загружена!');
    </script>
</body>
</html>
