<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SollyGIFT — Кейсы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0015, #1a0030);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }
        .header .subtitle {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }
        .balance {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ffd93d;
            padding: 12px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin-bottom: 20px;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .case-btn {
            padding: 18px 12px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .case-btn:active {
            transform: scale(0.95);
        }
        .case-btn .price {
            display: block;
            font-size: 13px;
            color: #ffd93d;
            margin-top: 6px;
        }
        .case-img {
            width: 100%;
            max-width: 80px;
            height: auto;
            display: block;
            margin: 0 auto 8px;
            border-radius: 12px;
            transition: transform 0.3s;
        }
        .case-btn:hover .case-img {
            transform: scale(1.05);
        }
        .case-btn.free {
            border-color: rgba(0, 255, 200, 0.25);
            background: rgba(0, 255, 200, 0.05);
        }
        .case-btn.common {
            border-color: rgba(70, 150, 255, 0.25);
            background: rgba(70, 150, 255, 0.05);
        }
        .case-btn.medium {
            border-color: rgba(180, 70, 255, 0.25);
            background: rgba(180, 70, 255, 0.05);
        }
        .case-btn.lux {
            border-color: rgba(255, 215, 0, 0.35);
            background: rgba(255, 215, 0, 0.08);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }
        .case-btn.legendary {
            border-color: rgba(255, 50, 50, 0.4);
            background: rgba(255, 50, 50, 0.1);
            box-shadow: 0 0 40px rgba(255, 50, 50, 0.08);
            animation: legendaryGlow 2s ease-in-out infinite;
        }
        @keyframes legendaryGlow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 50, 50, 0.1);
            }
            50% {
                box-shadow: 0 0 50px rgba(255, 50, 50, 0.25);
            }
        }
        .case-btn.emerald {
            border-color: rgba(0, 255, 150, 0.4);
            background: rgba(0, 255, 150, 0.08);
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.08);
            animation: emeraldGlow 2s ease-in-out infinite;
        }
        @keyframes emeraldGlow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(0, 255, 150, 0.1);
            }
            50% {
                box-shadow: 0 0 50px rgba(0, 255, 150, 0.25);
            }
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: linear-gradient(145deg, #1a0a2e, #2d1b4e);
            border-radius: 40px;
            padding: 35px 25px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            animation: modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalIn {
            from {
                transform: scale(0.8) translateY(40px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal-title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #ffd93d;
            margin-bottom: 15px;
        }
        .modal-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            min-height: 120px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .modal-item {
            text-align: center;
            padding: 12px 4px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: #ccc;
            transition: all 0.1s;
        }
        .modal-item .icon {
            font-size: 34px;
            display: block;
            margin-bottom: 4px;
        }
        .modal-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px;
            border-radius: 8px;
        }
        .modal-item .nft-tag {
            font-size: 9px;
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.12);
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 2px;
        }
        .modal-item .real-tag {
            font-size: 9px;
            color: #4ecdc4;
            background: rgba(0, 255, 200, 0.1);
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 2px;
        }
        .modal-item.highlight {
            border-color: #ffd93d;
            background: rgba(255, 215, 0, 0.1);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
        }
        .modal-item.spinning {
            border-color: rgba(255, 255, 255, 0.2);
            animation: spinItem 0.08s linear infinite;
        }
        @keyframes spinItem {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(5deg) scale(1.02);
            }
            100% {
                transform: rotate(0deg) scale(1);
            }
        }
        .modal-result {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding: 18px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 70px;
            border: 1px solid rgba(255, 215, 0, 0.08);
            background: rgba(0, 0, 0, 0.15);
            transition: all 0.4s;
        }
        .modal-result.win {
            color: #ffd93d;
            border-color: rgba(255, 215, 0, 0.25);
            background: rgba(255, 215, 0, 0.05);
            animation: resultWin 0.6s ease;
        }
        @keyframes resultWin {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-result.lose {
            color: #ff6b6b;
            border-color: rgba(255, 0, 0, 0.1);
        }
        .modal-result.legendary-win {
            color: #ffd700;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.15);
            animation: legendaryWin 0.8s ease;
        }
        @keyframes legendaryWin {
            0% {
                transform: scale(0.5) rotate(-10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(3deg);
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }
        .modal-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #ffd93d, #f7971e);
            color: #1a0030;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.25);
            transition: all 0.2s;
        }
        .modal-btn:active {
            transform: scale(0.95);
        }
        .modal-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .modal-close-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            background: transparent;
            color: #888;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
        }
        .modal-close-btn:active {
            transform: scale(0.95);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffd93d;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 215, 0, 0.12);
        }
        .toast.show {
            opacity: 1;
        }
        .bg-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-stars span {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: starFloat 6s linear infinite;
        }
        @keyframes starFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }
        .footer {
            text-align: center;
            color: #555;
            font-size: 11px;
            margin-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 14px;
        }
    </style>
</head>
