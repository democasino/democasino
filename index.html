<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SollyGIFT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0015, #1a0030);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 30px;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance {
            text-align: center;
            font-size: 24px;
            color: #ffd93d;
            padding: 12px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .case-btn {
            padding: 18px 12px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .case-btn:active {
            transform: scale(0.95);
        }
        .case-btn .price {
            display: block;
            font-size: 13px;
            color: #ffd93d;
            margin-top: 6px;
        }
        .case-img {
            width: 100%;
            max-width: 80px;
            height: auto;
            display: block;
            margin: 0 auto 8px;
            border-radius: 12px;
        }
        .case-btn.free {
            border-color: rgba(0, 255, 200, 0.25);
            background: rgba(0, 255, 200, 0.05);
        }
        .case-btn.common {
            border-color: rgba(70, 150, 255, 0.25);
            background: rgba(70, 150, 255, 0.05);
        }
        .case-btn.medium {
            border-color: rgba(180, 70, 255, 0.25);
            background: rgba(180, 70, 255, 0.05);
        }
        .case-btn.lux {
            border-color: rgba(255, 215, 0, 0.35);
            background: rgba(255, 215, 0, 0.08);
        }
        .case-btn.legendary {
            border-color: rgba(255, 50, 50, 0.4);
            background: rgba(255, 50, 50, 0.1);
            box-shadow: 0 0 40px rgba(255, 50, 50, 0.08);
        }
        .case-btn.emerald {
            border-color: rgba(0, 255, 150, 0.4);
            background: rgba(0, 255, 150, 0.08);
            box-shadow: 0 0 40px rgba(0, 255, 150, 0.08);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: linear-gradient(145deg, #1a0a2e, #2d1b4e);
            border-radius: 30px;
            padding: 35px 25px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.15);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-title {
            text-align: center;
            font-size: 24px;
            color: #ffd93d;
            margin-bottom: 15px;
        }
        .modal-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }
        .modal-item {
            text-align: center;
            padding: 12px 4px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: #ccc;
        }
        .modal-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px;
            border-radius: 8px;
        }
        .modal-item.highlight {
            border-color: #ffd93d;
            background: rgba(255, 215, 0, 0.1);
            transform: scale(1.05);
        }
        .modal-result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 60px;
            border: 1px solid rgba(255, 215, 0, 0.08);
            background: rgba(0, 0, 0, 0.15);
        }
        .modal-result.win {
            color: #ffd93d;
            border-color: rgba(255, 215, 0, 0.25);
        }
        .modal-result.lose {
            color: #ff6b6b;
            border-color: rgba(255, 0, 0, 0.1);
        }
        .modal-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #ffd93d, #f7971e);
            color: #1a0030;
        }
        .modal-btn:active {
            transform: scale(0.95);
        }
        .modal-btn:disabled {
            opacity: 0.5;
        }
        .modal-close-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 15px;
            background: transparent;
            color: #888;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffd93d;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .toast.show {
            opacity: 1;
        }
        .footer {
            text-align: center;
            color: #555;
            font-size: 11px;
            margin-top: 18px;
            padding-top: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SollyGIFT</h1>
            <div class="subtitle">Открывай кейсы, собирай NFT</div>
        </div>
        <div class="balance" id="balanceDisplay">⭐ 9999</div>

        <div class="cases-grid">
            <button class="case-btn free" onclick="openCase('free')">
                <img src="https://i.postimg.cc/mcy5QhDb/lv-0-20260901164904.png" alt="Бесплатный" class="case-img">
                Бесплатный
                <span class="price">0 ⭐</span>
            </button>
            <button class="case-btn common" onclick="openCase('common')">
                <img src="https://i.postimg.cc/XZkzwXJ4/lv-0-20260901165128.png" alt="Обычный" class="case-img">
                Обычный
                <span class="price">50 ⭐</span>
            </button>
            <button class="case-btn medium" onclick="openCase('medium')">
                <img src="https://i.postimg.cc/wtQGh3vp/lv-0-20260901165154.png" alt="Средний" class="case-img">
                Средний
                <span class="price">100 ⭐</span>
            </button>
            <button class="case-btn lux" onclick="openCase('lux')">
                <img src="https://i.postimg.cc/Nykz1LMv/lv-0-20260901165216.png" alt="Люкс" class="case-img">
                Люкс
                <span class="price">250 ⭐</span>
            </button>
            <button class="case-btn legendary" onclick="openCase('legendary')">
                <img src="https://i.postimg.cc/p9J6Dydw/lv-0-20260901165243.png" alt="Легендарный" class="case-img">
                Легендарный
                <span class="price">750 ⭐</span>
            </button>
            <button class="case-btn emerald" onclick="openCase('emerald')">
                <img src="https://i.postimg.cc/p9J6Dyd3/lv-0-20260901165304.png" alt="Изумруд" class="case-img">
                Изумруд
                <span class="price">1500 ⭐</span>
            </button>
        </div>

        <div class="footer">⚡ Демо-версия. Все звёзды бесконечны.</div>
    </div>

    <div class="modal-overlay" id="caseModal">
        <div class="modal">
            <div class="modal-title" id="modalTitle">📦 Открытие кейса</div>
            <div class="modal-items" id="modalItems"></div>
            <div class="modal-result" id="modalResult">🎰 Нажми "Открыть"</div>
            <button class="modal-btn" id="openCaseBtn">🔑 Открыть</button>
            <button class="modal-close-btn" id="closeModalBtn">Закрыть</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 9999;
        let isOpening = false;

        const nftImages = {
            'NFT 500⭐': [
                'https://i.postimg.cc/wtpryD6H/lv-0-20260901165509.png',
                'https://i.postimg.cc/GBx5k9pN/lv-0-20260901165353.png',
                'https://i.postimg.cc/d7jx8D0x/lv-0-20260901165431.png',
                'https://i.postimg.cc/qtTFh2kd/lv-0-20260901165543.png'
            ],
            'NFT 800⭐': [
                'https://i.postimg.cc/5HVrY8xc/lv-0-20260901165614.png',
                'https://i.postimg.cc/kVmH6W7L/lv-0-20260901165640.png',
                'https://i.postimg.cc/214qDKCK/lv-0-20260831161303.png'
            ],
            'NFT 1000⭐': [
                'https://i.postimg.cc/zLrQbTqc/lv-0-20260901165705.png',
                'https://i.postimg.cc/d7YfkGJH/lv-0-20260901165723.png',
                'https://i.postimg.cc/Y4HPGQtf/lv-0-20260901165742.png'
            ],
            'NFT 1500⭐': [
                'https://i.postimg.cc/cvYjLFGX/lv-0-20260901165802.png',
                'https://i.postimg.cc/Ty6sLnTm/lv-0-20260901165822.png'
            ],
            'NFT 2000⭐': [
                'https://i.postimg.cc/Ff46d0hG/lv-0-20260901165949.png',
                'https://i.postimg.cc/PCZc5Sny/lv-0-20260901170008.png'
            ],
            'NFT 2500⭐': [
                'https://i.postimg.cc/bZbMwmfT/lv-0-20260901170044.png'
            ]
        };

        const CASES = {
            free: {
                name: 'Бесплатный',
                price: 0,
                realItems: [
                    { name: '🍀 Попробуй снова', weight: 60 },
                    { name: '⭐ 1 звезда', weight: 25 },
                    { name: '🎁 Подарок', weight: 15 },
                ],
                displayItems: ['🖼️ Mirage #1', '🖼️ Mirage #2', '🖼️ Mirage #3']
            },
            common: {
                name: 'Обычный',
                price: 50,
                realItems: [
                    { name: '🖼️ NFT 500⭐', weight: 2 },
                    { name: '🖼️ NFT 500⭐', weight: 2 },
                    { name: '🎁 Подарок', weight: 40 },
                    { name: '⭐ 5 звёзд', weight: 30 },
                    { name: '🍀 Попробуй снова', weight: 26 },
                ],
                displayItems: ['🖼️ Mirage #1', '🖼️ Mirage #2', '🖼️ Mirage #3']
            },
            medium: {
                name: 'Средний',
                price: 100,
                realItems: [
                    { name: '🖼️ NFT 500⭐', weight: 2 },
                    { name: '🖼️ NFT 800⭐', weight: 2 },
                    { name: '🖼️ NFT 800⭐', weight: 2 },
                    { name: '🎁 Подарок', weight: 35 },
                    { name: '⭐ 10 звёзд', weight: 25 },
                    { name: '🍀 Попробуй снова', weight: 34 },
                ],
                displayItems: ['🖼️ Mirage #1', '🖼️ Mirage #2', '🖼️ Mirage #3', '🖼️ Mirage #4']
            },
            lux: {
                name: 'Люкс',
                price: 250,
                realItems: [
                    { name: '🖼️ NFT 500⭐', weight: 3 },
                    { name: '🖼️ NFT 800⭐', weight: 3 },
                    { name: '🖼️ NFT 1000⭐', weight: 3 },
                    { name: '🖼️ NFT 1000⭐', weight: 3 },
                    { name: '🎁 Подарок', weight: 30 },
                    { name: '⭐ 25 звёзд', weight: 20 },
                    { name: '🍀 Попробуй снова', weight: 38 },
                ],
                displayItems: ['🖼️ Mirage #1', '🖼️ Mirage #2', '🖼️ Mirage #3', '🖼️ Mirage #4']
            },
            legendary: {
                name: 'Легендарный',
                price: 750,
                realItems: [
                    { name: '🖼️ NFT 500⭐', weight: 20 },
                    { name: '🖼️ NFT 800⭐', weight: 15 },
                    { name: '🖼️ NFT 1000⭐', weight: 10 },
                    { name: '🖼️ NFT 1500⭐', weight: 5 },
                    { name: '🎁 Подарок', weight: 25 },
                    { name: '⭐ 50 звёзд', weight: 15 },
                    { name: '🍀 Попробуй снова', weight: 10 },
                ],
                displayItems: ['🖼️ Mirage #1', '🖼️ Mirage #2', '🖼️ Mirage #3', '🖼️ Mirage #4']
            },
            emerald: {
                name: 'Изумруд',
                price: 1500,
                realItems: [
                    { name: '🖼️ NFT 500⭐', weight: 15 },
                    { name: '🖼️ NFT 800⭐', weight: 12 },
                    { name: '🖼️ NFT 1000⭐', weight: 10 },
                    { name: '🖼️ NFT 1500⭐', weight: 8 },
                    { name: '🖼️ NFT 2000⭐', weight: 5 },
                    { name: '🖼️ NFT 2500⭐', weight: 3 },
                    { name: '🎁 Подарок', weight: 20 },
                    { name: '⭐ 100 звёзд', weight: 12 },
                    { name: '🍀 Попробуй снова', weight: 15 },
                ],
                displayItems: ['🖼️ Mirage #1', '🖼️ Mirage #2', '🖼️ Mirage #3', '🖼️ Mirage #4']
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').textContent = '⭐ ' + balance;
        }

        function getRandomRealItem(caseKey) {
            const items = CASES[caseKey].realItems;
            const total = items.reduce((s, i) => s + i.weight, 0);
            let r = Math.random() * total;
            for (const item of items) {
                r -= item.weight;
                if (r <= 0) return item;
            }
            return items[0];
        }

        function getNFTImage(name) {
            const key = name.includes('500') ? 'NFT 500⭐' :
                name.includes('800') ? 'NFT 800⭐' :
                name.includes('1000') ? 'NFT 1000⭐' :
                name.includes('1500') ? 'NFT 1500⭐' :
                name.includes('2000') ? 'NFT 2000⭐' :
                name.includes('2500') ? 'NFT 2500⭐' : null;
            if (key && nftImages[key]) {
                const images = nftImages[key];
                return images[Math.floor(Math.random() * images.length)];
            }
            return null;
        }

        function openCase(caseKey) {
            if (isOpening) {
                showToast('⏳ Подожди, кейс уже открывается...');
                return;
            }

            const caseData = CASES[caseKey];
            if (!caseData) {
                showToast('❌ Ошибка: кейс не найден');
                return;
            }

            if (caseData.price > balance && caseKey !== 'free') {
                showToast('❌ Недостаточно звёзд!');
                return;
            }

            const modal = document.getElementById('caseModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalItems = document.getElementById('modalItems');
            const modalResult = document.getElementById('modalResult');
            const openBtn = document.getElementById('openCaseBtn');

            modalTitle.textContent = '📦 ' + caseData.name;

            const allItems = [];
            caseData.displayItems.forEach(name => {
                allItems.push({ name, type: 'display' });
            });
            const realNames = [];
            caseData.realItems.forEach(item => {
                if (!realNames.includes(item.name)) {
                    realNames.push(item.name);
                    allItems.push({ name: item.name, type: 'real' });
                }
            });
            allItems.sort(() => Math.random() - 0.5);

            modalItems.innerHTML = allItems.map(item => {
                let icon = '🖼️';
                if (item.name.includes('Подарок')) icon = '🎁';
                else if (item.name.includes('звезд')) icon = '⭐';
                else if (item.name.includes('Попробуй')) icon = '🍀';

                if (item.name.includes('NFT')) {
                    const img = getNFTImage(item.name);
                    if (img) {
                        return `
                            <div class="modal-item" data-type="${item.type}">
                                <img src="${img}" alt="${item.name}">
                                ${item.name}
                            </div>
                        `;
                    }
                }
                return `
                    <div class="modal-item" data-type="${item.type}">
                        <span style="font-size:34px;display:block;">${icon}</span>
                        ${item.name}
                    </div>
                `;
            }).join('');

            modalResult.textContent = '🎰 Нажми "Открыть"';
            modalResult.className = 'modal-result';
            modal.classList.add('active');

            const closeModal = () => {
                modal.classList.remove('active');
                isOpening = false;
                openBtn.disabled = false;
                openBtn.textContent = '🔑 Открыть';
            };

            document.getElementById('closeModalBtn').onclick = closeModal;
            modal.onclick = function(e) {
                if (e.target === this) closeModal();
            };

            openBtn.onclick = function() {
                if (isOpening) return;
                isOpening = true;
                openBtn.disabled = true;
                openBtn.textContent = '⏳ Открываем...';

                if (caseKey !== 'free') {
                    balance -= caseData.price;
                    updateBalance();
                }

                const items = modalItems.querySelectorAll('.modal-item');
                const allImages = Object.values(nftImages).flat();
                let spins = 0;
                const maxSpins = 20 + Math.floor(Math.random() * 10);
                const spinInterval = setInterval(() => {
                    items.forEach(el => {
                        const imgEl = el.querySelector('img');
                        if (imgEl) {
                            const randomImg = allImages[Math.floor(Math.random() * allImages.length)];
                            el.innerHTML = `
                                <img src="${randomImg}" alt="NFT">
                                NFT ???
                            `;
                        } else {
                            const icons = ['🖼️', '🎁', '⭐', '🍀', '💎', '🔥'];
                            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                            el.innerHTML = `
                                <span style="font-size:34px;display:block;">${randomIcon}</span>
                                Приз ???
                            `;
                        }
                    });
                    spins++;
                    if (spins >= maxSpins) {
                        clearInterval(spinInterval);
                        const prize = getRandomRealItem(caseKey);
                        const isNFT = prize.name.includes('NFT');

                        items.forEach(el => {
                            const imgEl = el.querySelector('img');
                            if (isNFT) {
                                const img = getNFTImage(prize.name);
                                if (img) {
                                    el.innerHTML = `
                                        <img src="${img}" alt="${prize.name}">
                                        ${prize.name}
                                    `;
                                }
                            } else {
                                const icon = prize.name.includes('Подарок') ? '🎁' :
                                    prize.name.includes('звезд') ? '⭐' : '🍀';
                                el.innerHTML = `
                                    <span style="font-size:34px;display:block;">${icon}</span>
                                    ${prize.name}
                                `;
                            }
                        });

                        const randomIdx = Math.floor(Math.random() * items.length);
                        if (items[randomIdx]) {
                            items[randomIdx].classList.add('highlight');
                        }

                        modalResult.textContent = `🎉 Выпало: ${prize.name}`;
                        modalResult.className = 'modal-result win';

                        if (isNFT) {
                            const priceMatch = prize.name.match(/(\d+)/);
                            const price = priceMatch ? parseInt(priceMatch[0]) : 0;
                            if (price >= 1500) {
                                showToast(`👑 Легендарный выигрыш! ${prize.name}!`);
                            } else {
                                showToast(`🖼️ Выиграл ${prize.name}!`);
                            }
                        } else if (prize.name === '🍀 Попробуй снова') {
                            modalResult.textContent = '😔 Попробуй снова';
                            modalResult.className = 'modal-result lose';
                        } else if (prize.name.includes('⭐')) {
                            const stars = parseInt(prize.name.match(/(\d+)/)?.[0] || 0);
                            if (stars > 0 && caseKey !== 'free') {
                                balance += stars;
                                updateBalance();
                                showToast(`⭐ +${stars} звёзд!`);
                            }
                        }

                        isOpening = false;
                        openBtn.disabled = false;
                        openBtn.textContent = '🔑 Открыть ещё';
                    }
                }, 80);
            };
        }

        updateBalance();
        console.log('🎰 SollyGIFT загружен!');
        console.log('✅ Нажми на любой кейс, чтобы открыть');
</script>
</body>
</html>
